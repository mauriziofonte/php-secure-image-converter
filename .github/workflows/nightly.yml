name: Nightly

# The Trivy scan of the reference image, every night, so that an advisory
# published since the last push fails a run without waiting for one. The
# job is the trivy job of ci.yml (see its comment for the policy); keep the
# two in step.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (reference image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the reference image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/docker
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: sic-reference:ci

      - name: Report high and critical vulnerabilities, fixed or not
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: sic-reference:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

      - name: Fail on a critical vulnerability, fixed or not
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: sic-reference:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          trivyignores: tests/docker/.trivyignore
          format: table
          exit-code: '1'
