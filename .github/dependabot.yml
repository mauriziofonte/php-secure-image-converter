version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /
      - /tools/phpstan
      - /tools/php-cs-fixer
    schedule:
      interval: weekly
    groups:
      composer-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
